name: sabor_da_maria
version: 1.6.0
description: "Consultoria de cardápio do Sabor da Maria: pesquisa de receitas na web com referências regionais, despensa e perfil de negócio/cozinha em SQLite, conferência de ingredientes e orçamento, carrinho, CMV e análises de preço personalizadas depois do aceite do prato. Inclui provider local de web_extract para receitas (schema.org/Recipe)."
author: "Gabriel Sousa"
license: MIT
tags: [cozinha, precificacao, cmv, delivery, ifood]
provides_tools:
  - despensa_listar
  - despensa_buscar
  - despensa_atualizar
  - despensa_registrar_compras
  - perfil_cozinha_consultar
  - perfil_cozinha_salvar
  - negocio_salvar
  - pratos_selecionar
  - receita_conferir_ingredientes
  - prato_calcular_cmv
  - preco_sugerir
  - cardapio_registrar
  - cardapio_remover
  - cardapio_consultar
  - divulgacao_planejar
  - carrinho_consultar
  - carrinho_adicionar
  - carrinho_adicionar_prato
  - carrinho_remover
  - carrinho_montar_da_receita
  - salvos_salvar
  - analytics_analises_consultar
  - vendas_registrar
  - vendas_consultar
provides_hooks:
  # pre_llm_call: guarda o que a Dona Maria disse (falas.py, trava de evidência do perfil) e leva o carrinho,
  # o saldo e o perfil do negócio ao turno, com o roteiro da pesquisa de receitas quando ela pede (painel.py, pesquisa.py).
  # post_tool_call: respostas do clarify (falas.py) e o passo a passo da consultora para a tela (atividade.py).
  # transform_tool_result: o próximo passo no resultado de uma busca de receita e da leitura da página (pesquisa.py).
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
  - transform_llm_output
provides_middleware:
  - llm_execution
provides_web_providers:
  - receitas-local
optional_env:
  - SABOR_DA_MARIA_XLSX
  - SABOR_DA_MARIA_DB
  - SABOR_DA_MARIA_ORCAMENTO
  - SABOR_DA_MARIA_INTERNALS
  - SABOR_DA_MARIA_EMBEDDINGS_URL
  - SABOR_DA_MARIA_EMBEDDINGS_MODEL
# Sem dependências Python: só stdlib (sqlite3, zipfile, urllib, html.parser).
python_dependencies: []
