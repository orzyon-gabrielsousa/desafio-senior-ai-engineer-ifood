# SearXNG do Sabor da Maria — só o que difere do padrão (use_default_settings: true).
# Documentação: https://docs.searxng.org/admin/settings/
use_default_settings:
  engines:
    # Engines que exigem contact_url ou Tor; não servem para receitas e só geram erro no log.
    remove:
      - wikipedia
      - wikidata
      - openstreetmap
      - ahmia
      - torch

general:
  instance_name: "Sabor da Maria — busca local"
  debug: false
  enable_metrics: false

server:
  # Sobrescrito pela variável SEARXNG_SECRET do docker-compose.
  secret_key: "troque-este-segredo-local"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "pt-BR"
  # O Hermes consome /search?format=json; o JSON vem desligado por padrão.
  formats:
    - html
    - json

ui:
  default_locale: "pt-BR"
  query_in_title: true

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
