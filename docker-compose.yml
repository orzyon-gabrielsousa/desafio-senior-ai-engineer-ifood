# =============================================================================
# Sabor da Maria — stack 100% local
#
#   inference-llamacpp  (perfil "llamacpp", padrão)  llama.cpp + Qwen3-8B GGUF, GPU, porta 8000
#   inference-max       (perfil "max", experimental) Modular MAX + Qwen3.5-4B,  GPU, porta 8000
#   searxng             metabuscador local (web_search do Hermes), porta 8888
#   hermes              Hermes Agent (gateway + API server + TUI via exec),   porta 8642
#   api                 carrinho, saldo e perfil do negócio (Python stdlib, mesmo SQLite), porta 8700
#   playground          React (chat da consultora), nginx faz proxy das APIs, porta 3000
#
# Os dois motores de inferência respondem pelo alias de rede "inference"; o Hermes
# aponta para http://inference:8000/v1. Escolha o motor com COMPOSE_PROFILES no .env
# (padrão: llamacpp). Nunca suba os dois ao mesmo tempo (uma GPU, mesma porta).
#
# Ciclo de vida: nada aqui sobe com o sistema. O Docker sobe no boot e religa todo container com
# política always/unless-stopped; por isso todo serviço tem `restart: "no"`. A stack vive só enquanto
# o `make run` estiver rodando em primeiro plano, e Ctrl+C no terminal derruba tudo. Consequência: se
# um serviço cair (já vimos "CUDA error: the launch timed out" na inferência), nada o religa sozinho;
# Ctrl+C e `make run` de novo.
# =============================================================================
name: sabor-da-maria

services:
  inference-llamacpp:
    profiles: ["llamacpp"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13@sha256:18edb904ace42b3aeaac25e5326a4afc4c789cce232f1159a03fc41847d33cf0
    container_name: sabor-inference
    restart: "no"
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    entrypoint: ["/usr/bin/python3", "/opt/inference/llama_cache.py"]
    stop_grace_period: 60s
    networks:
      default:
        aliases: [inference]
    ports:
      # Dentro da rede do compose é sempre inference:8000; no host a porta é configurável
      # (8000 costuma estar ocupada por outros projetos).
      - "127.0.0.1:${INFERENCE_HOST_PORT:-8010}:8000"
    volumes:
      - ./models:/models:ro
      - ./inference/llamacpp/llama_cache.py:/opt/inference/llama_cache.py:ro
      - type: bind
        source: ./database-internals/kv
        target: /database-internals/kv
        bind:
          create_host_path: false
    environment:
      LLAMA_KV_SSD_INTERVAL: "${LLAMA_KV_SSD_INTERVAL:-30}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Qwen3 em modo não-pensante (reasoning budget 0): tool calling nativo via --jinja.
    # O Hermes exige >= 64k de contexto e o Qwen3-8B foi treinado com 40 960, então o
    # contexto é estendido para 65 536 com YaRN (fator 2 sobre 32 768, como a Qwen
    # recomenda). KV cache quantizado (K q8_0, V q4_0) para caber nos 16 GB da
    # RTX 5070 Ti junto com o desktop. Amostragem recomendada pela Qwen.
    # Teto de tokens por resposta (--n-predict): o Qwen3-8B às vezes não para de gerar (já vimos 7 mil e
    # 18 mil tokens num turno só) e a placa, dividida com o desktop, chegou a derrubar o servidor com
    # "CUDA error: the launch timed out". Uma resposta legítima daqui usa menos de 2 mil tokens.
    command: >
      --model /models/${LLAMA_MODEL_FILE:-Qwen3-8B-Q4_K_M.gguf}
      --alias ${MODEL_NAME:-qwen3-8b}
      --ctx-size ${LLAMA_CTX:-65536}
      --rope-scaling yarn --rope-scale ${LLAMA_ROPE_SCALE:-2} --yarn-orig-ctx 32768
      --n-gpu-layers 999
      --flash-attn on
      --cache-type-k q8_0 --cache-type-v ${LLAMA_KV_V_TYPE:-q4_0}
      --parallel 1
      --n-predict ${LLAMA_N_PREDICT:-4096}
      --jinja
      --reasoning-budget ${LLAMA_REASONING_BUDGET:-0}
      --temp 0.7 --top-p 0.8 --top-k 20 --min-p 0
      --metrics
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s

  inference-max:
    profiles: ["max"]
    image: modular/max-nvidia-full:${MAX_VERSION:-26.7.0}
    container_name: sabor-inference-max
    restart: "no"
    networks:
      default:
        aliases: [inference]
    ports:
      - "127.0.0.1:${INFERENCE_HOST_PORT:-8010}:8000"
    volumes:
      - ./models/hf:/root/.cache/huggingface
    environment:
      HF_HUB_ENABLE_HF_TRANSFER: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Experimental na RTX 50 (sm_120): ver inference/max/README.md. Só o Qwen3.5-4B
    # tem parser de tool calling no MAX; sem streaming com function calling.
    # O entrypoint da imagem já é `max serve`; aqui vão só os argumentos.
    command: >
      --model ${MAX_MODEL:-Qwen/Qwen3.5-4B}
      --port 8000
      --max-length ${LLAMA_CTX:-65536}
      --max-batch-size ${MAX_BATCH_SIZE:-1}
      --allow-extra-request-fields
      --device-memory-utilization ${MAX_DEVICE_MEMORY:-0.95}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/health || curl -fsS http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 60
      start_period: 180s

  embeddings:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    restart: "no"
    volumes:
      - ./models:/models:ro
    entrypoint: ["/bin/sh", "-ec"]
    # Sem pesos locais, a consultora continua recuperando memória por texto.
    # Nada é baixado no `make run` para habilitar os embeddings.
    command:
      - |
        model=/models/Qwen3-Embedding-0.6B-Q8_0.gguf
        while [ ! -s "$$model" ]; do sleep 5; done
        exec /app/llama-server --model "$$model" --alias qwen3-embedding-0.6b \
          --embedding --pooling last --n-gpu-layers 0 --ctx-size 2048 \
          --batch-size 2048 --ubatch-size 2048 --threads 4 --parallel 1 \
          --host 0.0.0.0 --port 8080 --no-webui

  searxng:
    image: searxng/searxng:latest
    container_name: sabor-searxng
    restart: "no"
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-troque-este-segredo-local}
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8080/healthz' >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v0.23.1}
    container_name: sabor-hermes
    restart: "no"
    depends_on:
      searxng:
        condition: service_healthy
      api:
        condition: service_healthy
      inference-llamacpp:
        condition: service_healthy
        required: false # Só o perfil selecionado no .env está ativo.
      inference-max:
        condition: service_healthy
        required: false
    # Diretório de trabalho = workspace com o AGENTS.md do projeto (contexto carregado
    # pelo Hermes). `docker compose exec hermes hermes` abre a TUI já nesse diretório.
    working_dir: /opt/data/workspace
    stdin_open: true
    tty: true
    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:9120:9120"
    volumes:
      # $HERMES_HOME inteiro versionado no repositório (config, SOUL, plugin, skills, memórias);
      # o estado de runtime (state.db, sessions, logs, cache) está no .gitignore.
      - ./hermes-home:/opt/data
      - ./database-internals:/database-internals
      # Planilha da Dona Maria (entrada do desafio), somente leitura.
      - ./data:/opt/data/sabor_da_maria/entrada:ro
      # Base de conhecimento do Analytics (pratos mais vendidos por zona, cidade, estado, região e país), somente leitura.
      - ./prompts:/prompts:ro
    environment:
      # Arquivos criados pelo container ficam com o seu usuário do host.
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      # Busca local.
      SEARXNG_URL: http://searxng:8080
      # Plugin sabor_da_maria.
      SABOR_DA_MARIA_XLSX: /opt/data/sabor_da_maria/entrada/despensa_dona_maria.xlsx
      SABOR_DA_MARIA_DB: /opt/data/sabor_da_maria/sabor_da_maria.db
      SABOR_DA_MARIA_INTERNALS: /database-internals
      SABOR_DA_MARIA_ORCAMENTO: "${SABOR_DA_MARIA_ORCAMENTO:-80}"
      SABOR_DA_MARIA_BASE_CONHECIMENTO: /prompts/base-de-conhecimento
      SABOR_DA_MARIA_EMBEDDINGS_URL: http://embeddings:8080/v1/embeddings
      SABOR_DA_MARIA_EMBEDDINGS_MODEL: qwen3-embedding-0.6b
      # API server OpenAI-compatible (http://localhost:8642/v1/chat/completions) para um
      # frontend próprio; a chave é local e o bind é só no loopback do host.
      API_SERVER_ENABLED: "${API_SERVER_ENABLED:-true}"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${API_SERVER_KEY:-sabor-da-maria-chave-local}
      API_SERVER_CORS_ORIGINS: ${API_SERVER_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Webapp/dashboard (opcionais) exigem login básico quando ligados.
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}
    command: ["gateway", "run"]
    healthcheck:
      test: ["CMD", "/opt/hermes/.venv/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://hermes:8642/health', timeout=2)"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 60s

  api:
    # Reaproveita a imagem do Hermes: é o mesmo Python em que o plugin roda e não há nada novo para baixar.
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v0.23.1}
    container_name: sabor-api
    restart: "no"
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    working_dir: /app
    entrypoint: ["/opt/hermes/.venv/bin/python3", "-m", "sabor_da_maria.api"]
    # A API é o PID 1 do container, e o kernel ignora SIGTERM em PID 1 que não instalou handler: o
    # `docker stop` esperava os 10 s e matava com SIGKILL, e o Ctrl+C do `make run` demorava por isso.
    # SIGINT cai no KeyboardInterrupt do main(), que fecha o servidor na hora.
    stop_signal: SIGINT
    ports:
      # Só loopback: o navegador chega aqui pelo nginx do playground (/api/); a porta serve ao `make playground-dev`.
      - "127.0.0.1:${API_HOST_PORT:-8700}:8700"
    volumes:
      # Mesmo código e mesmo SQLite do plugin: a tela e a consultora enxergam o mesmo carrinho, sem regra duplicada.
      - ./hermes-home/plugins:/app:ro
      - ./hermes-home/sabor_da_maria:/data
      - ./database-internals:/database-internals
      - ./data:/data/entrada:ro
      - ./prompts:/prompts:ro
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      SABOR_DA_MARIA_XLSX: /data/entrada/despensa_dona_maria.xlsx
      SABOR_DA_MARIA_DB: /data/sabor_da_maria.db
      SABOR_DA_MARIA_INTERNALS: /database-internals
      SABOR_DA_MARIA_ORCAMENTO: "${SABOR_DA_MARIA_ORCAMENTO:-80}"
      SABOR_DA_MARIA_BASE_CONHECIMENTO: /prompts/base-de-conhecimento
      SABOR_DA_MARIA_API_PORT: "8700"
    healthcheck:
      # O nome de serviço também confirma que o container está na rede do Compose.
      test: ["CMD", "/opt/hermes/.venv/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://api:8700/api/saude', timeout=2)"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 5s

  playground:
    build: ./playground
    image: sabor-da-maria-playground
    container_name: sabor-playground
    restart: "no"
    depends_on:
      hermes:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PLAYGROUND_HOST_PORT:-3000}:80"
    environment:
      API_SERVER_KEY: ${API_SERVER_KEY:-sabor-da-maria-chave-local}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ && wget -qO /dev/null http://127.0.0.1/api/saude && wget -qO /dev/null http://127.0.0.1/hermes/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
